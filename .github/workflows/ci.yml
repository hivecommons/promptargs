name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check committed dist/ is in sync with src/
        run: |
          test -z "$(git status --porcelain -- dist/)" || {
            git diff -- dist/
            git status --short -- dist/
            echo "::error::dist/ is stale — run 'npm run build' and commit the result"
            exit 1
          }

      - name: Test
        run: npm test

      - name: CLI smoke test
        run: |
          node dist/cli.js help
          node dist/cli.js env
          node dist/cli.js "Hello {{name}}" --name=World --no-interactive
          node dist/cli.js "Review {{file}} for {{focus}}" --file=a.go,b.go --focus=x,y --cross --no-interactive
