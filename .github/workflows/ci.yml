name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # Keep the ubuntu check names identical to the pre-matrix names
    # ("build-and-test (22)") so the required-status branch protection
    # keeps matching; macOS legs get a distinct, non-required name.
    name: build-and-test (${{ matrix.node-version }})${{ matrix.os == 'macos-latest' && ' macos' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check committed dist/ is in sync with src/
        run: |
          test -z "$(git status --porcelain -- dist/)" || {
            git diff -- dist/
            git status --short -- dist/
            echo "::error::dist/ is stale — run 'npm run build' and commit the result"
            exit 1
          }

      - name: Test
        run: npm test

      - name: CLI smoke test
        run: |
          node dist/cli.js help
          node dist/cli.js env
          node dist/cli.js "Hello {{name}}" --name=World --no-interactive
          node dist/cli.js "Review {{file}} for {{focus}}" --file=a.go,b.go --focus=x,y --cross --no-interactive
