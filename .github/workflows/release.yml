name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.7.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # npm provenance
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check committed dist/ is in sync with src/
        run: |
          test -z "$(git status --porcelain -- dist/)" || {
            git diff -- dist/
            git status --short -- dist/
            echo "::error::dist/ is stale — run 'npm run build' and commit the result"
            exit 1
          }

      - name: Test
        run: npm test

      - name: Check tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${RELEASE_TAG#v}"
          [ "$pkg" = "$tag" ] || {
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          }

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the version is live on npm
        run: |
          want="${RELEASE_TAG#v}"
          package="$(node -p "require('./package.json').name")"
          for attempt in 1 2 3 4 5 6; do
            got="$(npm view "$package@$want" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            [ "$got" = "$want" ] && exit 0
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "::error::npm does not serve $package@$want after publish"
          exit 1
