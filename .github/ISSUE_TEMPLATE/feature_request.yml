name: Feature request
description: Suggest an improvement or new capability for promptargs
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem are you trying to solve, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The command, flag, template syntax, output format, or library API change you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you have considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Would this change existing flags, `--json` or `--status` output, the `.prompts/` layout, or the library exports?
